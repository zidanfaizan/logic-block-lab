<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="45%" stop-color="#C026D3"/>
      <stop offset="85%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="goldKey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="castleWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="roofPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="doorGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="450" fill="url(#skyGrad)"/>

  <!-- Stars & Magic Sparkles -->
  <circle cx="120" cy="70" r="3" fill="#FFF" opacity="0.9"/>
  <circle cx="240" cy="50" r="4" fill="#FDE047" opacity="0.9"/>
  <circle cx="680" cy="80" r="3" fill="#FFF" opacity="0.9"/>
  <circle cx="730" cy="130" r="4" fill="#FDE047" opacity="0.8"/>
  <circle cx="340" cy="110" r="3" fill="#FFF" opacity="0.7"/>

  <!-- Cartoon Moon -->
  <circle cx="700" cy="90" r="38" fill="#FEF08A"/>
  <circle cx="715" cy="80" r="30" fill="#7C3AED" opacity="0.3"/>

  <!-- Rolling Purple Hills -->
  <path d="M-50 450 Q 150 320 400 370 T 850 330 L 850 450 Z" fill="#3B0764"/>
  <path d="M-20 450 Q 250 360 550 410 T 850 390 L 850 450 Z" fill="#2E1065"/>

  <!-- Castle Silhouette & Towers -->
  <!-- Left Outer Tower -->
  <rect x="230" y="190" width="60" height="180" fill="url(#castleWall)" rx="6"/>
  <polygon points="215,190 260,110 305,190" fill="url(#roofPink)"/>
  <!-- Right Outer Tower -->
  <rect x="510" y="190" width="60" height="180" fill="url(#castleWall)" rx="6"/>
  <polygon points="495,190 540,110 585,190" fill="url(#roofPink)"/>
  <!-- Center Main Keep -->
  <rect x="270" y="160" width="260" height="210" fill="url(#castleWall)" rx="8"/>
  <!-- Center Spire -->
  <rect x="365" y="110" width="70" height="90" fill="url(#castleWall)"/>
  <polygon points="345,110 400,30 455,110" fill="url(#roofPink)"/>
  <!-- Castle Battlements -->
  <rect x="270" y="150" width="25" height="15" fill="url(#roofPink)" rx="3"/>
  <rect x="310" y="150" width="25" height="15" fill="url(#roofPink)" rx="3"/>
  <rect x="465" y="150" width="25" height="15" fill="url(#roofPink)" rx="3"/>
  <rect x="505" y="150" width="25" height="15" fill="url(#roofPink)" rx="3"/>

  <!-- Glowing Magical Rune Portal / Door -->
  <path d="M 350 370 L 350 250 A 50 50 0 0 1 450 250 L 450 370 Z" fill="url(#doorGlow)" filter="url(#glowEffect)"/>
  <path d="M 360 370 L 360 255 A 40 40 0 0 1 440 255 L 440 370 Z" fill="#0891B2"/>
  <!-- Rune Pattern on Door -->
  <circle cx="400" cy="275" r="22" fill="none" stroke="#A5F3FC" stroke-width="4"/>
  <polygon points="400,260 415,285 385,285" fill="none" stroke="#FDE047" stroke-width="3"/>
  <circle cx="400" cy="275" r="6" fill="#FDE047"/>

  <!-- Castle Glowing Windows -->
  <rect x="250" y="240" width="20" height="36" rx="10" fill="#FDE047"/>
  <rect x="530" y="240" width="20" height="36" rx="10" fill="#FDE047"/>
  <rect x="390" y="130" width="20" height="32" rx="10" fill="#FDE047"/>

  <!-- Princess Kiki Character (Left) -->
  <g transform="translate(140, 240)">
    <!-- Princess Hair -->
    <circle cx="40" cy="50" r="38" fill="#1E1B4B"/>
    <!-- Twin Buns with Gold Ribbons -->
    <circle cx="10" cy="30" r="18" fill="#1E1B4B"/>
    <circle cx="70" cy="30" r="18" fill="#1E1B4B"/>
    <circle cx="10" cy="30" r="8" fill="#F59E0B"/>
    <circle cx="70" cy="30" r="8" fill="#F59E0B"/>
    <!-- Tiara / Crown -->
    <polygon points="26,18 40,2 54,18 48,18 40,10 32,18" fill="#FDE047" stroke="#B45309" stroke-width="2"/>
    <circle cx="40" cy="6" r="4" fill="#F43F5E"/>
    <!-- Face -->
    <circle cx="40" cy="55" r="28" fill="#FFEDD5"/>
    <!-- Eyes -->
    <ellipse cx="30" cy="52" rx="5" ry="7" fill="#1E1B4B"/>
    <ellipse cx="50" cy="52" rx="5" ry="7" fill="#1E1B4B"/>
    <circle cx="28" cy="49" r="2.5" fill="#FFF"/>
    <circle cx="48" cy="49" r="2.5" fill="#FFF"/>
    <!-- Blush -->
    <circle cx="23" cy="62" r="5" fill="#FDA4AF" opacity="0.8"/>
    <circle cx="57" cy="62" r="5" fill="#FDA4AF" opacity="0.8"/>
    <!-- Smile -->
    <path d="M 34 65 Q 40 72 46 65" fill="none" stroke="#E11D48" stroke-width="3" stroke-linecap="round"/>
    <!-- Royal Dress -->
    <path d="M 22 83 L 58 83 L 78 175 L 2 175 Z" fill="#EC4899" stroke="#BE185D" stroke-width="3"/>
    <path d="M 30 83 L 50 83 L 60 175 L 20 175 Z" fill="#F472B6"/>
    <!-- Dress Gold Trim -->
    <path d="M 2 175 Q 40 162 78 175" fill="none" stroke="#FDE047" stroke-width="5"/>
  </g>

  <!-- Giant Golden Magic Rune Key (Center-Right Floating) -->
  <g transform="translate(480, 210) rotate(-18)" filter="url(#glowEffect)">
    <!-- Key Halo Ring -->
    <circle cx="70" cy="70" r="55" fill="none" stroke="#FDE047" stroke-width="12" stroke-dasharray="14 10"/>
    <!-- Key Head (Crown/Heart) -->
    <circle cx="70" cy="70" r="42" fill="url(#goldKey)" stroke="#78350F" stroke-width="5"/>
    <circle cx="70" cy="70" r="22" fill="#7C3AED" stroke="#78350F" stroke-width="4"/>
    <!-- Gem in Center -->
    <polygon points="70,56 82,70 70,84 58,70" fill="#38BDF8"/>
    <!-- Key Shaft -->
    <rect x="62" y="110" width="16" height="130" fill="url(#goldKey)" stroke="#78350F" stroke-width="4" rx="4"/>
    <!-- Key Teeth -->
    <rect x="76" y="195" width="30" height="15" fill="url(#goldKey)" stroke="#78350F" stroke-width="3" rx="2"/>
    <rect x="76" y="222" width="24" height="14" fill="url(#goldKey)" stroke="#78350F" stroke-width="3" rx="2"/>
    <!-- Sparkles on Key -->
    <polygon points="70,30 73,42 85,45 73,48 70,60 67,48 55,45 67,42" fill="#FFF"/>
    <polygon points="110,95 112,103 120,105 112,107 110,115 108,107 100,105 108,103" fill="#FFF"/>
  </g>

  <!-- Big Bold Cartoon Title Banner -->
  <g transform="translate(400, 52)">
    <!-- Banner Shadow & Contour -->
    <rect x="-240" y="-36" width="480" height="66" rx="22" fill="#0F172A" transform="rotate(-1)"/>
    <rect x="-238" y="-38" width="476" height="64" rx="20" fill="#F43F5E" transform="rotate(-1)"/>
    <rect x="-234" y="-34" width="468" height="56" rx="17" fill="#FBBF24" transform="rotate(-1)"/>
    <!-- Text -->
    <text x="0" y="6" font-family="'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-weight="900" font-size="34" fill="#1E1B4B" text-anchor="middle" letter-spacing="1">
      KUNCI ISTANA AJAIB!
    </text>
    <!-- Mini Subtitle Tag -->
    <rect x="-110" y="30" width="220" height="22" rx="11" fill="#7C3AED"/>
    <text x="0" y="45" font-family="'Fredoka', 'Nunito', sans-serif" font-weight="800" font-size="12" fill="#FFF" text-anchor="middle">
      PETUALANGAN BOOLEAN &amp; RUNE
    </text>
  </g>

  <!-- Floating Crystal Runes (Decorative Cartoon Icons) -->
  <g transform="translate(620, 310)">
    <polygon points="25,5 45,35 5,35" fill="#38BDF8" stroke="#0284C7" stroke-width="3"/>
    <text x="25" y="30" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">AND</text>
  </g>
  <g transform="translate(80, 160)">
    <circle cx="25" cy="25" r="22" fill="#F43F5E" stroke="#BE185D" stroke-width="3"/>
    <text x="25" y="30" font-size="14" font-weight="bold" fill="#FFF" text-anchor="middle">OR</text>
  </g>
  <g transform="translate(680, 220)">
    <rect x="5" y="5" width="40" height="40" rx="8" fill="#10B981" stroke="#047857" stroke-width="3"/>
    <text x="25" y="30" font-size="13" font-weight="bold" fill="#FFF" text-anchor="middle">NOT</text>
  </g>


</svg>
