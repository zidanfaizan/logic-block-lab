<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFactory" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="40%" stop-color="#06B6D4"/>
      <stop offset="80%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="metalArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="beltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="carRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
  </defs>

  <!-- Factory Floor & Wall Background -->
  <rect width="800" height="450" fill="url(#bgFactory)"/>

  <!-- Background Factory Pipes and Steam -->
  <!-- Big Orange Pipes -->
  <path d="M 0 100 L 800 100" stroke="#F97316" stroke-width="24" stroke-linecap="round"/>
  <path d="M 120 100 L 120 20" stroke="#F97316" stroke-width="20"/>
  <path d="M 680 100 L 680 20" stroke="#F97316" stroke-width="20"/>
  <!-- Pipe Joints -->
  <rect x="110" y="50" width="20" height="12" rx="4" fill="#EA580C"/>
  <rect x="670" y="50" width="20" height="12" rx="4" fill="#EA580C"/>
  <!-- Steam Puffs -->
  <circle cx="120" cy="18" r="14" fill="#FFF" opacity="0.6"/>
  <circle cx="132" cy="10" r="10" fill="#FFF" opacity="0.4"/>
  <circle cx="680" cy="18" r="14" fill="#FFF" opacity="0.6"/>

  <!-- Cheerful Factory Windows -->
  <g opacity="0.25">
    <rect x="60" y="130" width="80" height="70" rx="8" fill="#FFF"/>
    <rect x="660" y="130" width="80" height="70" rx="8" fill="#FFF"/>
  </g>

  <!-- Giant Interactive Gears -->
  <g transform="translate(110, 160)" stroke="#1E293B" stroke-width="4">
    <circle cx="0" cy="0" r="42" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="18" fill="#0284C7"/>
    <!-- Gear teeth -->
    <rect x="-8" y="-50" width="16" height="14" rx="2" fill="#FBBF24"/>
    <rect x="-8" y="36" width="16" height="14" rx="2" fill="#FBBF24"/>
    <rect x="-50" y="-8" width="14" height="16" rx="2" fill="#FBBF24"/>
    <rect x="36" y="-8" width="14" height="16" rx="2" fill="#FBBF24"/>
  </g>
  <g transform="translate(180, 200)" stroke="#1E293B" stroke-width="3">
    <circle cx="0" cy="0" r="30" fill="#EC4899"/>
    <circle cx="0" cy="0" r="12" fill="#06B6D4"/>
  </g>

  <!-- Main Animated Conveyor Belt (Loop Theme!) -->
  <g transform="translate(0, 310)">
    <!-- Belt Stand Leg Supports -->
    <rect x="80" y="45" width="24" height="95" fill="#475569" stroke="#0F172A" stroke-width="4"/>
    <rect x="280" y="45" width="24" height="95" fill="#475569" stroke="#0F172A" stroke-width="4"/>
    <rect x="480" y="45" width="24" height="95" fill="#475569" stroke="#0F172A" stroke-width="4"/>
    <rect x="680" y="45" width="24" height="95" fill="#475569" stroke="#0F172A" stroke-width="4"/>

    <!-- Belt Beam -->
    <rect x="-20" y="20" width="840" height="40" rx="20" fill="url(#beltGrad)" stroke="#0F172A" stroke-width="5"/>
    
    <!-- Conveyor Rollers -->
    <circle cx="60" cy="40" r="14" fill="#94A3B8" stroke="#0F172A" stroke-width="3"/>
    <circle cx="160" cy="40" r="14" fill="#94A3B8" stroke="#0F172A" stroke-width="3"/>
    <circle cx="260" cy="40" r="14" fill="#94A3B8" stroke="#0F172A" stroke-width="3"/>
    <circle cx="360" cy="40" r="14" fill="#94A3B8" stroke="#0F172A" stroke-width="3"/>
    <circle cx="460" cy="40" r="14" fill="#94A3B8" stroke="#0F172A" stroke-width="3"/>
    <circle cx="560" cy="40" r="14" fill="#94A3B8" stroke="#0F172A" stroke-width="3"/>
    <circle cx="660" cy="40" r="14" fill="#94A3B8" stroke="#0F172A" stroke-width="3"/>
    <circle cx="760" cy="40" r="14" fill="#94A3B8" stroke="#0F172A" stroke-width="3"/>

    <!-- Conveyor Belt Chevron Tracks -->
    <path d="M 0 25 L 800 25" stroke="#FDE047" stroke-width="6" stroke-dasharray="25 15"/>
  </g>

  <!-- Toys on the Conveyor Belt -->
  <!-- Toy 1: Race Car -->
  <g transform="translate(80, 260)">
    <path d="M 0 35 L 20 20 L 70 20 L 95 35 L 110 40 L 0 40 Z" fill="url(#carRed)" stroke="#881337" stroke-width="3"/>
    <rect x="25" y="22" width="20" height="12" rx="3" fill="#67E8F9"/>
    <circle cx="25" cy="42" r="14" fill="#1E293B" stroke="#FDE047" stroke-width="4"/>
    <circle cx="85" cy="42" r="14" fill="#1E293B" stroke="#FDE047" stroke-width="4"/>
    <text x="55" y="34" font-weight="900" font-size="12" fill="#FFF">01</text>
  </g>

  <!-- Toy 2: Cute Teddy Bear -->
  <g transform="translate(240, 245)">
    <circle cx="35" cy="40" r="24" fill="#B45309" stroke="#451A03" stroke-width="3"/>
    <!-- Ears -->
    <circle cx="16" cy="20" r="10" fill="#B45309" stroke="#451A03" stroke-width="3"/>
    <circle cx="54" cy="20" r="10" fill="#B45309" stroke="#451A03" stroke-width="3"/>
    <circle cx="16" cy="20" r="5" fill="#FDE68A"/>
    <circle cx="54" cy="20" r="5" fill="#FDE68A"/>
    <!-- Snout & Eyes -->
    <ellipse cx="35" cy="44" rx="12" ry="9" fill="#FDE68A"/>
    <circle cx="28" cy="34" r="3" fill="#1E293B"/>
    <circle cx="42" cy="34" r="3" fill="#1E293B"/>
    <ellipse cx="35" cy="42" rx="4" ry="3" fill="#1E293B"/>
    <path d="M 20 50 Q 35 60 50 50 L 48 70 L 22 70 Z" fill="#EF4444" stroke="#451A03" stroke-width="2"/>
  </g>

  <!-- Toy 3: Golden Star Cookie / Gift Box -->
  <g transform="translate(620, 248)">
    <rect x="10" y="10" width="55" height="50" rx="8" fill="#8B5CF6" stroke="#4C1D95" stroke-width="3"/>
    <!-- Yellow Ribbon -->
    <rect x="33" y="10" width="10" height="50" fill="#FDE047"/>
    <rect x="10" y="30" width="55" height="10" fill="#FDE047"/>
    <!-- Bow -->
    <circle cx="38" cy="10" r="9" fill="#F59E0B" stroke="#78350F" stroke-width="2"/>
  </g>

  <!-- Center Robotic Arm Assembling (Loop Mechanic!) -->
  <g transform="translate(430, 90)">
    <!-- Arm Base from Ceiling -->
    <rect x="25" y="0" width="40" height="30" fill="#334155" stroke="#0F172A" stroke-width="3" rx="4"/>
    <!-- Arm Joint 1 -->
    <circle cx="45" cy="40" r="18" fill="url(#metalArm)" stroke="#78350F" stroke-width="4"/>
    <!-- Arm Segment 1 -->
    <rect x="36" y="40" width="18" height="70" rx="8" fill="url(#metalArm)" stroke="#78350F" stroke-width="3" transform="rotate(-15 45 40)"/>
    <!-- Arm Joint 2 -->
    <circle cx="70" cy="115" r="15" fill="url(#metalArm)" stroke="#78350F" stroke-width="3"/>
    <!-- Arm Segment 2 -->
    <rect x="62" y="115" width="16" height="65" rx="6" fill="url(#metalArm)" stroke="#78350F" stroke-width="3" transform="rotate(25 70 115)"/>
    <!-- Claw Hand -->
    <g transform="translate(38, 175)">
      <circle cx="15" cy="10" r="10" fill="#E11D48"/>
      <!-- Left Claw Finger -->
      <path d="M 5 15 Q -10 35 5 45" fill="none" stroke="#FDE047" stroke-width="7" stroke-linecap="round"/>
      <!-- Right Claw Finger -->
      <path d="M 25 15 Q 40 35 25 45" fill="none" stroke="#FDE047" stroke-width="7" stroke-linecap="round"/>
      <!-- Sparkles / Laser Beam -->
      <line x1="15" y1="20" x2="15" y2="55" stroke="#38BDF8" stroke-width="4" stroke-dasharray="4 3"/>
      <circle cx="15" cy="55" r="7" fill="#FDE047" opacity="0.9"/>
    </g>
  </g>

  <!-- Manager Bot Character (Friendly Robot Helper on the Right) -->
  <g transform="translate(680, 160)">
    <!-- Yellow Hard Hat -->
    <path d="M 10 32 Q 40 5 70 32 Z" fill="#FDE047" stroke="#92400E" stroke-width="3"/>
    <rect x="5" y="30" width="70" height="7" rx="3" fill="#F59E0B" stroke="#92400E" stroke-width="2"/>
    <!-- Head -->
    <rect x="15" y="37" width="50" height="40" rx="10" fill="#38BDF8" stroke="#0369A1" stroke-width="3"/>
    <!-- Big Digital Eyes (Winking / Smiling) -->
    <circle cx="30" cy="55" r="7" fill="#FFF"/>
    <circle cx="30" cy="55" r="4" fill="#0F172A"/>
    <path d="M 45 55 Q 52 48 58 55" fill="none" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
    <!-- Body -->
    <rect x="10" y="80" width="60" height="65" rx="12" fill="#F97316" stroke="#9A3412" stroke-width="3"/>
    <!-- Screen Meter on Chest with Loop Icon -->
    <rect x="22" y="92" width="36" height="24" rx="4" fill="#1E293B"/>
    <text x="40" y="108" font-family="monospace" font-weight="bold" font-size="12" fill="#22C55E" text-anchor="middle">↻ x3</text>
  </g>

  <!-- Big Cartoon Title Banner -->
  <g transform="translate(400, 50)">
    <!-- Banner Shadow & Contour -->
    <rect x="-240" y="-36" width="480" height="66" rx="22" fill="#0F172A" transform="rotate(1)"/>
    <rect x="-238" y="-38" width="476" height="64" rx="20" fill="#F97316" transform="rotate(1)"/>
    <rect x="-234" y="-34" width="468" height="56" rx="17" fill="#FEF08A" transform="rotate(1)"/>
    <!-- Text -->
    <text x="0" y="6" font-family="'Fredoka', 'Nunito', 'Arial Black', sans-serif" font-weight="900" font-size="32" fill="#1E1B4B" text-anchor="middle" letter-spacing="1">
      PABRIK MAINAN OTOMATIS!
    </text>
    <!-- Subtitle Tag -->
    <rect x="-120" y="30" width="240" height="22" rx="11" fill="#059669"/>
    <text x="0" y="45" font-family="'Fredoka', 'Nunito', sans-serif" font-weight="800" font-size="12" fill="#FFF" text-anchor="middle">
      KALKULASI LOOP &amp; NESTED LOOP
    </text>
  </g>


</svg>
